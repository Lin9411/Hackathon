<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校園活動簽到 - 身分綁定</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-2">校園活動簽到認證</h2>
    <p class="text-sm text-slate-500 text-center mb-6">請填寫基本資料完成身分綁定</p>

    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">學號 / 教工號</label>
        <input type="text" id="studentId" placeholder="例如：13173215"
          class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">姓名</label>
        <input type="text" id="name" placeholder="例如：王小明"
          class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">系所 / 單位</label>
        <input type="text" id="department" placeholder="例如：資訊管理學系"
          class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">驗證信箱 (可填個人 Gmail)</label>
        <input type="email" id="email" placeholder="例如：your_account@gmail.com"
          class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- 發送驗證碼按鈕 -->
      <button id="sendOtpBtn" onclick="handleSendOtp()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition">
        發送驗證碼
      </button>

      <!-- 驗證碼輸入區 (預設隱藏) -->
      <div id="otpSection" class="hidden pt-4 border-t border-slate-200 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">6 位數驗證碼</label>
          <input type="text" id="otpCode" maxlength="6" placeholder="請輸入郵件中的 6 位驗證碼"
            class="w-full px-4 py-2 border text-center text-xl tracking-widest font-mono rounded-xl focus:ring-2 focus:ring-green-500 outline-none">
        </div>

        <button onclick="handleVerifyOtp()"
          class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2.5 rounded-xl transition">
          完成綁定
        </button>
      </div>

      <div id="msgBox" class="text-center text-sm font-medium hidden mt-2"></div>
    </div>
  </div>

  <script>
    let lineUserId = "MOCK_USER_" + Math.floor(Math.random() * 10000); // 預設模擬 UID

    // 初始化 LIFF
    async function initLiff() {
      try {
        // 請將此處替換為你在 LINE Developers 申請的 LIFF ID (若純瀏覽器測試未填也可運作)
        await liff.init({ liffId: "你的_LIFF_ID" });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          lineUserId = profile.userId;
        }
      } catch (err) {
        console.log("非 LINE 瀏覽器環境，使用測試 UID:", lineUserId);
      }
    }
    initLiff();

    // 當學號輸入改變時，自動在信箱欄位建議預設格式 (使用者仍可隨意修改為個人 Gmail)
    document.getElementById("studentId").addEventListener("input", function (e) {
      const sid = e.target.value.trim();
      const emailInput = document.getElementById("email");
      if (sid && !emailInput.value.includes("@gmail.com")) {
        emailInput.value = sid + "@scu.edu.tw";
      }
    });

    function showMsg(text, isError = false) {
      const box = document.getElementById("msgBox");
      box.textContent = text;
      box.className = `text-center text-sm font-medium mt-2 ${isError ? 'text-red-500' : 'text-blue-600'}`;
      box.classList.remove("hidden");
    }

    async function handleSendOtp() {
      const studentId = document.getElementById("studentId").value.trim();
      const name = document.getElementById("name").value.trim();
      const department = document.getElementById("department").value.trim();
      const email = document.getElementById("email").value.trim();

      if (!studentId || !name || !department || !email) {
        showMsg("請將所有欄位填寫完整", true);
        return;
      }

      if (!email.includes("@")) {
        showMsg("請輸入有效的電子信箱格式", true);
        return;
      }

      const btn = document.getElementById("sendOtpBtn");
      btn.disabled = true;
      btn.textContent = "發送中...";

      try {
        const res = await fetch("/api/send-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ studentId, name, department, email, lineUserId })
        });

        const data = await res.json();
        if (res.ok) {
          showMsg("驗證碼已發送至 " + email + "，請前往查收！");
          document.getElementById("otpSection").classList.remove("hidden");
          btn.textContent = "重新發送";
          btn.disabled = false;
        } else {
          showMsg(data.detail || "發送失敗", true);
          btn.disabled = false;
          btn.textContent = "發送驗證碼";
        }
      } catch (err) {
        showMsg("伺服器連線異常", true);
        btn.disabled = false;
        btn.textContent = "發送驗證碼";
      }
    }

    async function handleVerifyOtp() {
      const studentId = document.getElementById("studentId").value.trim();
      const name = document.getElementById("name").value.trim();
      const department = document.getElementById("department").value.trim();
      const email = document.getElementById("email").value.trim();
      const otpCode = document.getElementById("otpCode").value.trim();

      if (!otpCode || otpCode.length !== 6) {
        showMsg("請輸入完整的 6 位數驗證碼", true);
        return;
      }

      try {
        const res = await fetch("/api/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ studentId, name, department, email, otpCode, lineUserId })
        });

        const data = await res.json();
        if (res.ok) {
          alert("🎉 身分綁定成功！未來活動掃碼即可直接簽到。");
          if (typeof liff !== "undefined" && liff.isInClient()) {
            liff.closeWindow(); // 於 LINE 內直接關閉視窗
          }
        } else {
          showMsg(data.detail || "驗證碼錯誤", true);
        }
      } catch (err) {
        showMsg("驗證失敗，請稍後再試", true);
      }
    }
  </script>
</body>

</html>
